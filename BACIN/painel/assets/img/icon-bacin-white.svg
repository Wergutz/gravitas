<!--
  BACIN TERRAPLANAGEM — marca provisória, versão para fundo escuro
  (cabeçalhos navy do painel, executor e master).

  APROXIMAÇÃO nas cores e na forma da marca real (hexágono vermelho/preto);
  NÃO é o logotipo oficial. Substituir este arquivo pela arte definitiva
  assim que ela estiver disponível — todas as telas já apontam para cá.
  Se a arte vier em PNG, salvar como icon-bacin-white.png e trocar a extensão
  nas referências (grep -rn icon-bacin BACIN).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="BACIN Terraplanagem">
  <title>BACIN Terraplanagem</title>
  <polygon points="100,12 176,56 176,144 100,188 24,144 24,56"
           fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round"/>
  <polygon points="62,50 62,150 130,100" fill="#E1251B"/>
</svg>
