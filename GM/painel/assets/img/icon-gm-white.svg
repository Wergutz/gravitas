<!--
  GM SERVIÇOS — logotipo, versão para FUNDO ESCURO.
  Usado nos cabeçalhos navy dos apps (gradiente #0b1c2d -> #071422).

  Mesmo desenho da versão clara, com dois ajustes:

  1. O verde-escuro (#1E8A3E) vira branco.
  2. O disco verde-claro vira um ANEL (contorno, miolo transparente) e a
     faixa fica com preenchimento transparente. Sem isso o monograma
     branco cairia sobre o verde-claro #A9D18E — contraste de ~1,7:1, que
     some a 32 px. Com o miolo vazado, o fundo escuro atravessa e o branco
     lê perfeitamente, e o anel verde mantém a cor da marca presente.

  Nada de retângulo ou fundo chapado: a marca funciona sobre o gradiente da
  sidebar e sobre qualquer outro fundo escuro.

  Assim como na versão clara, "SERVIÇOS" e "Projetos e Construções" ficam de
  fora — ilegíveis no tamanho em que o ícone é usado.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="GM SERVIÇOS">
  <title>GM SERVIÇOS</title>

  <!-- disco da marca, vazado -->
  <circle cx="100" cy="104" r="88" fill="none" stroke="#A9D18E" stroke-width="9"/>

  <!-- faixa diagonal com ponta de seta, vazada -->
  <g transform="rotate(-12 100 100)">
    <path d="M34 46 H170 V28 L204 64 L170 100 V82 H34 Z"
          fill="none" stroke="#ffffff" stroke-width="6"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- monograma -->
  <text x="100" y="164" text-anchor="middle"
        font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif"
        font-weight="900" font-size="86" textLength="128"
        lengthAdjust="spacingAndGlyphs" fill="#ffffff">GM</text>
</svg>
