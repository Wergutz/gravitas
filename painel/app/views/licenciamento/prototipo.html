<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel Gravitas · Uruguaiana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
<style>
/* Tokens da Plataforma Gravitas (gravitas.net.br/principal/painel) */
:root{
  --navy:#1A2D4F; --navy-900:#11203B; --navy-700:#27406A; --navy-500:#3A578A;
  --ink:#1E2738; --muted:#6B7686; --faint:#98A2B3; --line:#E4E8EF; --line-2:#EEF1F6; --surface:#FFFFFF; --surface-2:#F4F6FA; --ground:#F4F6FA;
  --gold:#E0A53D; --gold-600:#C68C28; --gold-ink:#3A2A06;
  --ok:#1F7A6E; --ok-bg:#E6F3F1; --aviso:#A96C2A; --aviso-bg:#F6ECE0; --erro:#B23A2C; --erro-bg:#F7E4E1; --info:#2F6BA6; --info-bg:#E4EEF8; --neutral:#8A95A6; --neutral-bg:#EDF0F4;
  --text:var(--ink);
  --rail:var(--navy); --rail-text:#C7D2E5; --rail-hi:#FFFFFF; --rail-sub:#9FB4D6; --rail-line:rgba(255,255,255,.10); --rail-on:rgba(255,255,255,.12);
  --accent:var(--gold); --accent-ink:var(--gold-ink); --focus:var(--info);
  --good:var(--ok); --warn:var(--gold-600); --serious:var(--info); --crit:var(--erro);
  --good-bg:var(--ok-bg); --warn-bg:#F8EFDC; --serious-bg:var(--info-bg); --crit-bg:var(--erro-bg);
  --radius:14px; --radius-lg:18px; --radius-sm:9px;
  --shadow:0 4px 24px rgba(26,45,79,.04); --shadow-lg:0 20px 50px rgba(16,32,72,.14);
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Plus Jakarta Sans","Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1729; --surface:#152238; --surface-2:#1B2A44; --line:#2A3A57; --line-2:#22314C;
    --text:#E6EAF2; --ink:#E6EAF2; --muted:#A5B1C6; --faint:#6F7E99;
    --rail:#0B1424; --rail-line:rgba(255,255,255,.08);
    --ok-bg:#153A36; --aviso-bg:#3E2C14; --erro-bg:#43201C; --info-bg:#1B2F4A; --neutral-bg:#243247; --warn-bg:#3E3014;
    --good-bg:var(--ok-bg); --serious-bg:var(--info-bg); --crit-bg:var(--erro-bg);
    --good:#4FB3A5; --warn:#E0A53D; --serious:#6EA6DF; --crit:#E0665A; --neutral:#8A95A6;
    --focus:#8FBDEB; --shadow:0 4px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1729; --surface:#152238; --surface-2:#1B2A44; --line:#2A3A57; --line-2:#22314C;
  --text:#E6EAF2; --ink:#E6EAF2; --muted:#A5B1C6; --faint:#6F7E99;
  --rail:#0B1424; --rail-line:rgba(255,255,255,.08);
  --ok-bg:#153A36; --aviso-bg:#3E2C14; --erro-bg:#43201C; --info-bg:#1B2F4A; --neutral-bg:#243247; --warn-bg:#3E3014;
  --good-bg:var(--ok-bg); --serious-bg:var(--info-bg); --crit-bg:var(--erro-bg);
  --good:#4FB3A5; --warn:#E0A53D; --serious:#6EA6DF; --crit:#E0665A; --neutral:#8A95A6;
  --focus:#8FBDEB; --shadow:0 4px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.3px;text-wrap:balance;color:var(--text)}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hide{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.app.pub{grid-template-columns:1fr}
.rail{background:var(--rail);color:var(--rail-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 14px 14px}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 18px;border-bottom:1px solid var(--rail-line)}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;color:var(--rail-hi);font-size:14px;font-weight:800;letter-spacing:3px;line-height:1.1}
.brand span{display:block;font-size:9.5px;letter-spacing:1.5px;color:var(--rail-sub);text-transform:uppercase;margin-top:3px}
.who{padding:14px 6px;border-bottom:1px solid var(--rail-line)}
.who .eyebrow{color:var(--rail-sub);margin-bottom:6px;font-size:9.5px;letter-spacing:1.5px}
.who select{width:100%;background:rgba(255,255,255,.08);color:var(--rail-hi);border:1px solid rgba(255,255,255,.14);padding:8px 10px;border-radius:var(--radius-sm)}
/* A lista aberta do seletor é desenhada pelo sistema, com fundo claro, mas
   herda a cor do <select> — que aqui é branca, para contrastar com a barra
   escura. Resultado: branco no branco, e só a opção destacada aparecia. O par
   abaixo fixa fundo e texto juntos, para não depender do tema do sistema. */
select option{background:var(--rail-hi);color:var(--navy)}
.who .role{margin-top:8px;font-size:12px;color:var(--rail-text);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border:1px solid rgba(255,255,255,.18);border-radius:999px;color:var(--rail-hi)}
.nav{padding:10px 0;display:flex;flex-direction:column;gap:2px;flex:1}
.nav .eyebrow{color:var(--rail-sub);padding:12px 12px 6px;font-size:9.5px;letter-spacing:1.5px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--rail-text);padding:10px 12px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav button span.l{flex:1}
.nav button:hover{background:rgba(255,255,255,.07);color:var(--rail-hi)}
.nav button.on{background:var(--rail-on);color:var(--rail-hi)}
.nav button .n{font-size:11px;font-weight:700;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center}
.railfoot{padding:14px 6px 0;border-top:1px solid var(--rail-line);font-size:11px;color:var(--rail-sub);line-height:1.5}
.railfoot a{color:var(--rail-hi);text-decoration:none;font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:22px 28px 0;position:sticky;top:0;z-index:5;background:linear-gradient(var(--ground) 80%,transparent)}
.topbar h1{font-size:21px}
.topbar .city{font-size:13px;color:var(--muted);margin-top:2px}
.topbar .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-width:280px}
.search input{border:0;background:none;outline:none;width:100%;font-size:13px}
.bell{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 8px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.bell .av{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.bell .n{font-size:11px;font-weight:700;background:var(--erro);color:#fff;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.bell .n.zero{background:var(--neutral-bg);color:var(--muted)}
.content{padding:18px 28px 40px;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;align-items:start}
.content.one{grid-template-columns:minmax(0,1fr)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;grid-column:1/-1}
.pagehead h2{font-size:20px}
.pagehead p{color:var(--muted);max-width:66ch;margin-top:4px}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;grid-column:1/-1;margin-bottom:4px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:var(--shadow)}
.kpi .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;background:var(--neutral-bg);color:var(--muted)}
.kpi .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi .v{font-size:26px;font-weight:800;line-height:1.1;color:var(--text);letter-spacing:-.5px}
.kpi .eyebrow{font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:4px}
.kpi.good .ic{background:var(--ok-bg);color:var(--good)}.kpi.warn .ic{background:var(--warn-bg);color:var(--warn)}.kpi.crit .ic{background:var(--erro-bg);color:var(--crit)}.kpi.serious .ic{background:var(--info-bg);color:var(--serious)}.kpi.acc .ic{background:#FBF1DE;color:var(--gold-600)}
:root[data-theme="dark"] .kpi.acc .ic{background:#3E3014}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi.acc .ic{background:#3E3014}}

/* ---------- panels & lists ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.panel>header h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--gold)}
.row .code{font-size:12px;color:var(--muted);font-weight:500}
.row .title{font-weight:600}
.row .sub{font-size:12px;color:var(--muted);margin-top:2px}
.row .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.neutral{background:var(--neutral-bg);color:var(--text);border-color:var(--line)}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--aviso)}.pill.serious{background:var(--serious-bg);color:var(--serious)}.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.step{background:var(--surface-2);color:var(--muted);border-color:var(--line);font-size:11px}
.empty{padding:28px 16px;color:var(--muted);text-align:center;font-size:13px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;line-height:1.2;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.btn.pri:hover{background:var(--gold-600);border-color:var(--gold-600)}
.btn.green{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- detail drawer ---------- */
.drawer{position:sticky;top:84px;max-height:calc(100vh - 104px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)}
.drawer .head{padding:18px 20px 14px;border-bottom:1px solid var(--line-2)}
.drawer .head .code{font-size:12px;color:var(--muted);font-weight:500}
.drawer .head h3{font-size:17px;margin-top:2px}
.drawer .head .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.drawer section{padding:14px 20px;border-bottom:1px solid var(--line-2)}
.drawer section:last-child{border-bottom:0}
.drawer section h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:700}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.kv dd.mono{font-family:var(--sans);font-size:13px;font-weight:500}
.steps{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:8px}
.steps i{height:5px;background:var(--line);display:block;border-radius:3px}
.steps i.done{background:var(--ok)}.steps i.cur{background:var(--gold)}.steps i.bad{background:var(--crit)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding:6px 0;position:relative}
.tl li:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:6px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.tl li.acc:before{background:var(--gold)}
.tl li.bad:before{background:var(--crit)}
.tl li.ok:before{background:var(--ok)}
.tl li:not(:last-child):after{content:"";position:absolute;left:5px;top:18px;bottom:-8px;width:2px;background:var(--line-2)}
.tl .t{font-size:11px;color:var(--faint);font-weight:500}
.tl .e{font-size:12.5px}
.tl .h{font-family:var(--mono);font-size:10px;color:var(--faint);word-break:break-all}
.docs{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12.5px;background:var(--surface-2)}
.doc .k{font-size:11px;font-weight:800;min-width:34px;color:var(--navy);letter-spacing:.02em}
:root[data-theme="dark"] .doc .k{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .doc .k{color:var(--gold)}}
.doc .s{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--surface-2),var(--line));border:1px solid var(--line-2);border-radius:8px;display:grid;place-items:end start;padding:5px;font-size:10px;color:var(--muted);font-weight:500}
.callout{border-left:3px solid var(--gold);background:var(--surface-2);padding:10px 12px;font-size:12.5px;color:var(--text);border-radius:0 10px 10px 0}
.callout.warn{border-left-color:var(--aviso);background:var(--aviso-bg)}.callout.crit{border-left-color:var(--erro);background:var(--erro-bg)}.callout.good{border-left-color:var(--ok);background:var(--ok-bg)}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:18px}
.form .full{grid-column:1/-1}
.f label{display:block;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);padding:9px 12px;border-radius:10px;font-size:13px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px rgba(47,107,166,.15)}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.f input:disabled,.f select:disabled{background:var(--surface-2);color:var(--faint)}
.formfoot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;padding-top:8px;border-top:1px solid var(--line-2)}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:7px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;background:var(--surface)}
.radio input,.f .radio input{margin:0;width:auto;flex:none;accent-color:var(--navy)}
.f .radio label{display:inline-flex;font-weight:500;font-size:12.5px;margin:0;color:var(--text)}
.calc{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:13px;padding:14px 18px;background:var(--surface-2);border-top:1px solid var(--line-2)}
.calc .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.calc .tot{font-weight:800;font-size:16px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.calc .tot.r{color:var(--crit)}
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);font-weight:700;background:var(--surface-2)}
.table td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
.table td.r,.table th.r{text-align:right;font-variant-numeric:tabular-nums}
.table tr:last-child td{border-bottom:0}
.table .on td{background:var(--surface-2)}
.tabwrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}
.pex{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pexc{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.pexc h4{font-size:13.5px;margin-bottom:6px;letter-spacing:0}
.pexc ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--muted)}
.pexc li{margin:2px 0}
.pexc.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}

/* ---------- map ---------- */
.map{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden}
.map svg{width:100%;height:auto;display:block}
.map .lbl{font-family:var(--sans);font-size:9px;font-weight:500;fill:var(--faint);letter-spacing:.02em}
.map .seg{stroke:var(--line);stroke-width:5;stroke-linecap:butt;fill:none;cursor:pointer}
.map .seg.hit{stroke-width:14;stroke:transparent}
.map .seg.on{stroke-width:7}
.map .ring{fill:none;stroke:var(--text);stroke-width:1.5;stroke-dasharray:3 2}
.map .corr{stroke:var(--navy);stroke-width:9;opacity:.25;fill:none}
:root[data-theme="dark"] .map .corr{stroke:#8FA3C4}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line-2);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:5px;display:inline-block;border-radius:3px}
.pubhead{background:linear-gradient(135deg,var(--navy-900),var(--navy) 60%,var(--navy-700));color:#fff;padding:26px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pubhead .pb{display:flex;align-items:center;gap:14px}
.pubhead .pb svg{width:44px;height:44px;flex:none}
.pubhead h1{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.5px;color:#fff}
.pubhead h1 em{font-style:normal;color:var(--gold)}
.pubhead .sub{color:rgba(255,255,255,.7);font-size:13px;margin-top:2px}
.pubhead .sp{flex:1}
.pubhead .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.pub .content{grid-template-columns:minmax(0,1fr) 400px}
.rua{display:flex;flex-direction:column;gap:8px}
.rua .it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
.rua .it .q{font-size:11px;color:var(--muted);font-weight:500}

<script>
/* ===================== ESTADO E UTILITÁRIOS ===================== */
const S = {uid:'obr1', view:'inbox', sel:null, q:'', read:new Set(), tab:{}};
const PARAMS = {auditPct:20, garantiaMeses:12, caucaoM:202.32, susp:{}, leiMulta:false, ufm:CITY.ufm};
const $ = (s)=>document.querySelector(s);
const brl = (v)=>'R$ '+(Math.round(v*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now = ()=>{const d=new Date();return d.toISOString().slice(0,10)+' '+d.toTimeString().slice(0,5)};
const U = ()=>USERS.find(u=>u.id===S.uid);
const P = ()=>U().perfil;
const INT = (id)=>INTS.find(i=>i.id===id);
const cur = (segId)=>INTS.filter(i=>i.seg===segId).sort((a,b)=>b.dt.localeCompare(a.dt))[0];
const popOf = (it)=>POP[ST[it.st].pop];
const stepIdx = (st)=>{ const m={s9b:8,s13b:12,s14:-1}; return m[st]!==undefined?m[st]:ORDER.indexOf(st); };
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);}
function log(it, e, w){ const l={t:now(), w:w||(U().nome+' · '+U().org.split(' —')[0].split(' /')[0]), e}; l.hash=h(it.id+l.t+e); it.log.push(l); AUDIT.push({t:l.t,w:l.w,int:it.id,e,hash:l.hash}); }
function notify(to, int, txt){ NOTIF.unshift({t:now(), to, from:U().org.split(' —')[0].split(' /')[0], int, txt}); }
function myNotifs(){ const u=U(); const key = u.perfil==='terc'?'terc:'+u.interv:u.perfil; return NOTIF.filter(n=>n.to===key); }
function unread(){ return myNotifs().filter(n=>!S.read.has(n.t+n.int)).length; }
function go(view, sel){ S.view=view; if(sel!==undefined) S.sel=sel; render(); }
function sel(id){ S.sel = (S.sel===id?null:id); render(); }
function pill(it){ const p=popOf(it); return `<span class="pill ${p.cls}"><i></i>${ST[it.st].n}</span>`; }
function due(it){ /* vistoria de garantia devida? */ return it.vgar && it.vgar<=now().slice(0,10); }
function caucaoDe(it){ return it.ext*PARAMS.caucaoM; }

/* ===================== FILAS POR PERFIL ===================== */
function queue(){
  const u=U();
  const q=[];
  if(u.perfil==='pref'){
    INTS.forEach(it=>{
      if(it.st==='s4'){ const need=[]; if(!it.sig.LAV)need.push('LAV'); if(!it.sig.LFT)need.push('LFT'); const mine=need.filter(d=>(u.assina||[]).includes(d)); q.push({it, a: mine.length?`Assinar ${mine.join(' + ')}`:`Aguarda ${need.join(' + ')}`, pri: mine.length?1:3, fn: mine.length?()=>sel(it.id):null}); }
      if(it.st==='s3') q.push({it, a:'Enviar para análise', pri:1, fn:()=>act_analise(it.id)});
      if(it.st==='s8' && it.ensaios.some(e=>e.st==='lançado'&&!e.ok)) q.push({it, a:'Ensaio não conforme — notificar', pri:1, fn:()=>go('not',it.id)});
      if(it.st==='s9b' && !it.docs.some(d=>d[0]==='NOT')) q.push({it, a:'Emitir notificação', pri:1, fn:()=>go('not',it.id)});
      if(it.st==='s9b' && it.docs.some(d=>d[0]==='NOT')) q.push({it, a:'Prazo em curso · multa se vencer', pri:2, fn:()=>go('multa',it.id)});
      if(it.st==='s13b') q.push({it, a:'Prazo vencido — multa / ofício', pri:1, fn:()=>go('of',it.id)});
      if(it.st==='s14' && !it.docs.some(d=>d[0]==='OF')) q.push({it, a:'Escalonar — ofício AGERGS/MP', pri:1, fn:()=>go('of',it.id)});
    });
  }
  if(u.perfil==='terc'){
    INTS.filter(it=>it.interv===u.interv).forEach(it=>{
      if(it.st==='s1') q.push({it,a:'Registrar vistoria prévia',pri:1,fn:()=>sel(it.id)});
      if(it.st==='s5') q.push({it,a:'Informar início da execução',pri:2,fn:()=>sel(it.id)});
      if(it.st==='s6') q.push({it,a:'Informar conclusão + controle tecnológico',pri:2,fn:()=>sel(it.id)});
      if(it.st==='s9b'||it.st==='s13b') q.push({it,a:'Responder notificação — informar refazimento',pri:1,fn:()=>sel(it.id)});
      if(it.multas.some(m=>m.st==='emitida')) q.push({it,a:'Auto de infração — pagar ou recorrer',pri:1,fn:()=>go('multa',it.id)});
      if(it.st==='s14') q.push({it,a:'Regularizar — solicitar LAV/LFT',pri:1,fn:()=>sel(it.id)});
    });
  }
  if(u.perfil==='grav'){
    INTS.forEach(it=>{
      if(it.st==='s2') q.push({it,a:'Auditar vistoria prévia',pri:1,fn:()=>sel(it.id)});
      if(it.st==='s7') q.push({it,a:'Vistoria de recebimento',pri:1,fn:()=>sel(it.id)});
      if(it.st==='s8' && it.ensaios.some(e=>e.st==='lançado')) q.push({it,a:'Concluir recebimento com o ensaio',pri:1,fn:()=>sel(it.id)});
      if(['s10','s11','s12'].includes(it.st) && due(it)) q.push({it,a:'Vistoria de garantia devida',pri:1,fn:()=>sel(it.id)});
      if(it.st==='s13b' && !it.docs.some(d=>d[0]==='PP')) q.push({it,a:'Emitir parecer de patologia',pri:2,fn:()=>sel(it.id)});
    });
  }
  if(u.perfil==='lab'){
    INTS.forEach(it=>it.ensaios.filter(e=>e.st==='pendente').forEach(e=>q.push({it,a:`Lançar ${e.id}`,pri:1,fn:()=>sel(it.id)})));
  }
  return q.sort((a,b)=>a.pri-b.pri);
}

/* ===================== AÇÕES ===================== */
function act_nova(f){
  const seg=SEG[f.seg]; const u=U();
  const it=mk({seg:f.seg, interv:u.interv, motivo:f.motivo, ext:+f.ext, larg:+f.larg, st:'s1', dt:now().slice(0,10), log:[]});
  INTS.unshift(it); log(it,'Solicitação registrada (LAV + LFT) — previsão '+f.prev+', '+f.dias+' dias, bloqueio '+f.bloq);
  notify('pref',it.id,`Nova solicitação ${u.interv} — ${seg.rua}, ${seg.entre}`); notify('grav',it.id,'Nova solicitação aguarda vistoria prévia do interveniente');
  toast('Solicitação registrada — registre a vistoria prévia para seguir'); go('inbox',it.id);
}
function act_prev(id,f){ const it=INT(id); it.prev={pav:f.pav,trincas:f.trincas,afund:f.afund,obs:f.obs}; it.fotos=+f.fotos; it.st='s2'; log(it,`Vistoria prévia registrada — ${f.fotos} fotos georreferenciadas; pavimento ${f.pav.toLowerCase()}`); notify('grav',id,'Vistoria prévia registrada — auditar'); toast('Vistoria prévia registrada'); render(); }
function act_audit(id,ok,obs){ const it=INT(id); it.st='s4'; log(it, ok?'Prévia auditada — concorda com a declaração do interveniente'+(obs?'; '+obs:'')+'. Processo enviado para análise':'Prévia auditada — DIVERGE: '+obs+'. Interveniente tem 5 dias úteis para contestar. Processo enviado para análise com ressalva'); notify('pref',id,'Prévia auditada — analisar LAV (Obras) e LFT (SESTRA)'); notify('terc:'+it.interv,id, ok?'Vistoria prévia auditada sem ressalva':'Vistoria prévia auditada com divergência — 5 dias úteis para contestar'); toast('Auditoria registrada'); render(); }
function act_analise(id){ const it=INT(id); it.st='s4'; log(it,'Enviada para análise — Obras (LAV) e SESTRA (LFT)'); render(); }
function act_sign(id,doc){ const it=INT(id); const u=U(); it.sig[doc]={w:u.nome,t:now()}; log(it,`${doc} assinada (${u.cert})`);
  if(it.sig.LAV&&it.sig.LFT){ it.st='s5'; it.caucao=caucaoDe(it); const n=String(31+INTS.filter(i=>i.docs.some(d=>d[0]==='LAV')).length).padStart(4,'0');
    it.docs.push(['LAV',`Licença de Abertura de Vala nº ${n}/2026`,now().slice(0,10)],['LFT',`Licença de Fechamento de Trânsito nº ${n}/2026`,now().slice(0,10)],['PEX',`Padrão executivo — ${SEG[it.seg].pav}`,now().slice(0,10)]);
    log(it,`Licenciada — LAV + LFT emitidas; caução ${brl(it.caucao)} (${it.ext} m × ${brl(PARAMS.caucaoM)}/m)`); notify('terc:'+it.interv,id,'Licença emitida — LAV, LFT e padrão executivo disponíveis'); notify('grav',id,'Licenciada — acompanhar execução'); toast('Licença emitida; caução calculada'); }
  else { toast(doc+' assinada — falta '+(doc==='LAV'?'LFT (SESTRA)':'LAV (Obras)')); notify('pref',id,`${doc} assinada — falta ${doc==='LAV'?'LFT':'LAV'}`); }
  render(); }
function act_start(id){ const it=INT(id); it.st='s6'; log(it,'Início de execução informado — sinalização conforme LFT'); notify('pref',id,'Execução iniciada'); toast('Início registrado — a rua aparece como aberta no mapa público'); render(); }
function act_done(id,f){ const it=INT(id); it.st='s7'; it.docs.push(['CT',`Controle tecnológico do executor — ${f.pts} pontos`,now().slice(0,10)]); log(it,`Conclusão informada — ${it.ext} m repavimentados; controle tecnológico anexado (${f.pts} pontos, espessura média ${f.esp} cm)`); notify('grav',id,'Conclusão informada — vistoria de recebimento'); notify('pref',id,'Conclusão informada — análise crítica do controle tecnológico'); toast('Conclusão informada'); render(); }
function act_recv(id,ok,ap){ const it=INT(id);
  if(ok){ it.st='s10'; it.docs.push(['TRP','Termo de Recebimento Provisório',now().slice(0,10)]); it.vgar=addM(now().slice(0,10),1); log(it,'Vistoria de recebimento sem apontamento — TRP emitido; medição liberada; vistoria de garantia 1 mês em '+it.vgar); notify('terc:'+it.interv,id,'Recebida provisoriamente — TRP disponível'); notify('pref',id,'TRP emitido'); }
  else { it.st='s9b'; it.apont=ap; log(it,`Vistoria de recebimento — ${ap.length} apontamento(s); laudo VG-${String(31+AUDIT.length).padStart(4,'0')}`); notify('pref',id,'Laudo com apontamentos — emitir notificação'); notify('terc:'+it.interv,id,'Laudo de recebimento com apontamentos'); }
  toast(ok?'Recebida provisoriamente':'Laudo emitido — prefeitura notifica'); render(); }
function act_not(id,prazo,txt){ const it=INT(id); const n=String(8+INTS.filter(i=>i.docs.some(d=>d[0]==='NOT')).length).padStart(4,'0'); it.docs.push(['NOT',`Notificação nº ${n}/2026 — prazo ${prazo} dias`,now().slice(0,10)]); it.prazo=prazo; log(it,`Notificação ${n}/2026 emitida — refazimento em ${prazo} dias. ${txt||''}`); notify('terc:'+it.interv,id,`Notificação ${n}/2026 — refazimento em ${prazo} dias`); toast('Notificação assinada e enviada'); render(); }
function act_fix(id,txt){ const it=INT(id); it.st= it.st==='s13b'?'s12':'s8'; log(it,'Refazimento informado pelo interveniente: '+txt); notify('grav',id,'Refazimento informado — nova vistoria'); notify('pref',id,'Interveniente respondeu à notificação'); toast('Resposta enviada — Gravitas fará nova vistoria'); render(); }
function act_gar(id,ok,obs){ const it=INT(id); const nxt={s10:'s11',s11:'s12',s12:'s13a'}[it.st]; const lbl={s10:'1 mês',s11:'6 meses',s12:'12 meses'}[it.st];
  if(ok){ it.docs.push(['VG',`Vistoria de garantia ${lbl} — sem patologia`,now().slice(0,10)]); it.st=nxt; if(nxt==='s13a'){ it.docs.push(['TRD','Termo de Recebimento Definitivo — caução liberada',now().slice(0,10)]); log(it,`Vistoria de garantia ${lbl} sem patologia — TRD emitido; caução ${brl(it.caucao)} liberada`); it.caucao=0; it.vgar=null; notify('terc:'+it.interv,id,'Recebida definitivamente — caução liberada'); } else { it.vgar=addM(now().slice(0,10),nxt==='s11'?5:6); log(it,`Vistoria de garantia ${lbl} — sem patologia; próxima em ${it.vgar}`); } }
  else { it.st='s13b'; it.apont=[{n:obs,g:'grave'}]; it.docs.push(['VG',`Vistoria de garantia ${lbl} — patologia`,now().slice(0,10)]); log(it,`Vistoria de garantia ${lbl} — patologia: ${obs}`); notify('pref',id,'Patologia em garantia — notificar refazimento'); notify('terc:'+it.interv,id,'Patologia constatada em garantia'); }
  toast('Vistoria de garantia registrada'); render(); }
function act_parecer(id,causa,txt){ const it=INT(id); const n='PP-'+String(9+INTS.filter(i=>i.docs.some(d=>d[0]==='PP')).length).padStart(4,'0'); it.docs.push(['PP',`Parecer de patologia ${n} — ${causa}`,now().slice(0,10)]); log(it,`Parecer de patologia ${n}: causa provável ${causa}. ${txt}`); notify('pref',id,`Parecer ${n} disponível — fundamenta notificação e ofício`); toast('Parecer assinado (ICP-Brasil) e publicado'); render(); }
function act_ensaio(id,tipo,pts){ const it=INT(id); const e={id:'OE-2026-'+String(12+INTS.reduce((a,i)=>a+i.ensaios.length,0)).padStart(3,'0'), tipo, pts:+pts, st:'pendente', ped:now().slice(0,10), por:U().nome}; it.ensaios.push(e); it.st='s8'; log(it,`Ordem de ensaio ${e.id} — ${tipo}, ${pts} ponto(s) — laboratório independente`); notify('lab',id,`Ordem de ensaio ${e.id} — ${SEG[it.seg].rua}`); toast('Ordem de ensaio enviada ao laboratório'); render(); }
function act_lab(id,oe,f){ const it=INT(id); const e=it.ensaios.find(x=>x.id===oe); const esp=+f.esp, proj=+f.proj, gc=+f.gc, lig=+f.lig, ligp=+f.ligp;
  const chk=[ {k:'Espessura', v:`${esp.toFixed(1)} cm × ${proj.toFixed(1)} cm (${((esp/proj-1)*100).toFixed(1)}%)`, ok:Math.abs(esp/proj-1)<=0.05},
              {k:'Grau de compactação', v:`${gc.toFixed(1)}%`, ok:gc>=97&&gc<=101},
              {k:'Teor de ligante', v:`${lig.toFixed(2)}% × ${ligp.toFixed(2)}% (Δ ${(lig-ligp).toFixed(2)})`, ok:Math.abs(lig-ligp)<=0.3} ];
  e.st='lançado'; e.res=chk; e.ok=chk.every(c=>c.ok); e.lanc=now(); e.hash=h(oe+JSON.stringify(chk)+e.lanc);
  log(it,`Resultado ${oe} lançado pelo laboratório — ${e.ok?'CONFORME':'NÃO CONFORME'} (DNIT 112/2009). hash ${e.hash}`, U().nome+' · Laboratório');
  notify('pref',id,`Ensaio ${oe} ${e.ok?'conforme':'NÃO conforme'}`); notify('grav',id,`Ensaio ${oe} lançado — concluir recebimento`); toast('Resultado lançado — registro imutável'); render(); }
function act_multa(id,m){ const it=INT(id); m.id='AI-2026-'+String(13+INTS.reduce((a,i)=>a+i.multas.length,0)).padStart(4,'0'); m.dt=now().slice(0,10); m.st='emitida'; it.multas.push(m); it.docs.push(['AI',`Auto de infração ${m.id} — ${m.base}`,m.dt]); log(it,`Auto de infração ${m.id} — ${m.base}: ${brl(m.total)}`); notify('terc:'+it.interv,id,`Auto de infração ${m.id} — ${brl(m.total)}`); toast('Auto de infração assinado e notificado'); render(); }
function act_of(id,dest){ const it=INT(id); const n=String(42+INTS.filter(i=>i.docs.some(d=>d[0]==='OF')).length).padStart(4,'0'); it.docs.push(['OF',`Ofício nº ${n}/2026 — ${dest}`,now().slice(0,10)]); if(it.st!=='s14'){ it.stPrev=it.st; it.st='s14'; } log(it,`Ofício ${n}/2026 assinado e protocolado — ${dest}. Laudo, notificação e trilha anexados`); notify('terc:'+it.interv,id,`Ofício ${n}/2026 encaminhado — ${dest}`); toast('Ofício protocolado'); render(); }
function act_susp(interv){ PARAMS.susp[interv]=!PARAMS.susp[interv]; AUDIT.push({t:now(),w:U().nome,int:'—',e:(PARAMS.susp[interv]?'Suspensa':'Restabelecida')+' a emissão de novas LAV para '+interv+' (poder de polícia — ato motivado)',hash:h(interv+now())}); toast((PARAMS.susp[interv]?'Suspensa':'Restabelecida')+' a emissão de licenças para '+interv); render(); }
function act_user(f){ USERS.splice(USERS.length-1,0,{id:'u'+Date.now(), nome:f.nome, org:f.org, perfil:f.perfil, papel:f.papel, cert:f.cert, interv:f.interv||undefined, assina:f.papel==='Signatário'?['LAV','NOT','AI','OF']:[]}); toast('Usuário criado — convite enviado por e-mail'); render(); }
function addM(d,m){ const x=new Date(d+'T12:00:00'); x.setMonth(x.getMonth()+m); return x.toISOString().slice(0,10); }
function F(form){ const o={}; new FormData(form).forEach((v,k)=>o[k]=v); return o; }
</script>

function render(){
  QF.length=0; const app=$('#app'); const p=P();
  if(p==='pop'){ app.className='app pub'; app.innerHTML=publicPage(); return; }
  app.className='app';
  app.innerHTML = rail() + `<div class="main">${topbar()}<div class="content ${S.sel?'':'one'}">${view()}${S.sel?drawer(INT(S.sel)):''}</div></div>`;
  const d=$('.drawer'); if(d&&S.scrollDrawer){d.scrollTop=0;S.scrollDrawer=false;}
}
function rail(){
  const u=U(), pr=PROFILES[u.perfil], q=queue(), n=unread();
  const opts=USERS.map(x=>`<option value="${x.id}" ${x.id===S.uid?'selected':''}>${esc(x.nome)} — ${PROFILES[x.perfil].nome}</option>`).join('');
  const nav=pr.nav.map(([k,l])=>{ let c=''; if(k==='inbox')c=q.length; if(k==='not'&&u.perfil==='terc')c=n; return `<button class="${S.view===k?'on':''}" onclick="go('${k}')">${IC[k]||IC.todas}<span class="l">${l}</span>${c?`<span class="n">${c}</span>`:''}</button>`; }).join('');
  return `<aside class="rail">
    <div class="brand">${MARK}<div><b>GRAVITAS</b><span>Painel de Controle</span></div></div>
    <div class="who"><div class="eyebrow">Entrar como (demonstração)</div>
      <select onchange="S.uid=this.value;S.view=PROFILES[USERS.find(u=>u.id===this.value).perfil].nav[0]?.[0]||'inbox';S.sel=null;render()">${opts}</select>
      <div class="role"><span class="tag">${PROFILES[u.perfil].nome.toUpperCase()}</span><span>${esc(u.papel)}</span>${u.cert!=='—'?`<span class="tag">${u.cert}</span>`:''}</div>
      <div class="small faint" style="margin-top:6px">${esc(u.org)}</div></div>
    <nav class="nav"><div class="eyebrow">Licenciamento viário · ${CITY.nome}</div>${nav}</nav>
    <div class="railfoot"><a href="__APP_BASE__/">← Painel de Controle</a><br>Modelo de demonstração — dados fictícios sobre malha esquemática do Centro. Registros com carimbo de tempo e hash; assinaturas ICP-Brasil nos atos com efeito jurídico.</div>
  </aside>`;
}
function topbar(){

  return `<div class="topbar"><div><h1>${t}</h1><div class="city">Prefeitura Municipal de ${CITY.nome} · ${INTS.length} intervenções na base · ${SEGS.length} segmentos carregados (amostra)</div></div><div class="sp"></div>

function rows(list, actFn){
  if(!list.length) return `<div class="empty">Nada pendente aqui.</div>`;
  return list.map((x,k)=>{ const it=x.it||x; const s=SEG[it.seg]; const key=QF.length; if(x.fn) QF.push(x.fn);
    const a=x.a?`<button class="btn sm ${x.pri===1?'pri':''}" ${x.fn?'':'disabled'} onclick="event.stopPropagation();QF[${key}]()">${esc(x.a)}</button>`:'';
    return `<div class="row ${S.sel===it.id?'sel':''}" onclick="sel('${it.id}')"><div class="code">${it.id}<br><span class="faint">${s.id}</span></div><div><div class="title">${esc(s.rua)} <span class="muted">· ${esc(s.entre)}</span></div><div class="sub">${esc(it.interv)} · ${esc(it.motivo)} · ${it.ext} m · ${esc(s.pav)}</div></div><div class="act">${pill(it)}${a}</div></div>`; }).join('');
}

    if(v==='pat'){ const l=INTS.filter(i=>i.st==='s13b'||i.docs.some(d=>d[0]==='PP')); return `<div class="stack">${panel('Pareceres de patologia', rows(l))}</div>`; }
    if(v==='ens'){ const l=INTS.filter(i=>i.ensaios.length); return `<div class="stack">${panel('Ensaios — análise crítica e contraprova', `<div class="tabwrap"><table class="table"><tr><th>Ordem</th><th>Intervenção</th><th>Tipo</th><th>Situação</th><th>Resultado</th></tr>${l.flatMap(it=>it.ensaios.map(e=>`<tr onclick="sel('${it.id}')" style="cursor:pointer"><td class="mono">${e.id}</td><td>${esc(SEG[it.seg].rua)}</td><td>${esc(e.tipo)}</td><td><span class="pill ${e.st==='pendente'?'warn':'neutral'}"><i></i>${e.st}</span></td><td>${e.res?e.res.map(c=>`<span class="pill ${c.ok?'good':'crit'}" style="margin:1px"><i></i>${c.k}</span>`).join(''):'—'}</td></tr>`)).join('')}</table></div>`)}</div>`; }
  }
  if(p==='adm'){
    if(v==='users'){ return `<div class="stack">${panel('Usuários cadastrados', `<div class="tabwrap"><table class="table"><tr><th>Nome</th><th>Órgão</th><th>Perfil</th><th>Papel</th><th>Assina</th><th>Certificado</th><th></th></tr>${USERS.filter(x=>x.perfil!=='pop').map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.org)}</td><td><span class="pill neutral">${PROFILES[x.perfil].nome}</span></td><td>${esc(x.papel)}</td><td class="mono small">${(x.assina||[]).join(' ')||'—'}</td><td class="small">${x.cert}</td><td><button class="btn sm" onclick="toast('Convite reenviado')">Reenviar convite</button></td></tr>`).join('')}</table></div>`)}
      ${panel('Novo usuário', `<form class="form" onsubmit="event.preventDefault();act_user(F(this))"><div class="f"><label>Nome</label><input name="nome" required placeholder="Nome completo"></div><div class="f"><label>Órgão / empresa</label><input name="org" required placeholder="Ex.: Corsan — Unidade Fronteira Oeste"></div><div class="f"><label>Perfil</label><select name="perfil"><option value="pref">Prefeitura</option><option value="terc">Interveniente</option><option value="lab">Laboratório</option><option value="grav">Gravitas</option><option value="adm">Administração</option></select></div><div class="f"><label>Papel</label><select name="papel"><option>Operador</option><option>Signatário</option><option>Responsável técnico</option></select></div><div class="f"><label>Interveniente (se terceiro)</label><select name="interv"><option value="">—</option><option>Corsan</option><option>RGE</option><option>CEEE Equatorial</option><option>Claro (fibra)</option><option>Sulgás</option></select></div><div class="f"><label>Certificado digital</label><select name="cert"><option>—</option><option>ICP-Brasil A1</option><option>ICP-Brasil A3</option><option>gov.br (prata/ouro)</option></select><div class="hint">Signatários assinam LAV, notificações, autos e ofícios; operadores preparam.</div></div><div class="formfoot"><button class="btn pri">Criar e convidar</button></div></form>`)}</div>`; }
    if(v==='params'){ return `<div class="stack">${panel('Parâmetros — decisões da administração municipal', `<form class="form" onsubmit="event.preventDefault();const f=F(this);PARAMS.auditPct=+f.aud;PARAMS.garantiaMeses=+f.gar;PARAMS.caucaoM=+f.cau;PARAMS.leiMulta=f.lei==='sim';PARAMS.ufm=+f.ufm;toast('Parâmetros salvos — registrados na trilha de auditoria');AUDIT.push({t:now(),w:U().nome,int:'—',e:'Parâmetros alterados: auditoria '+f.aud+'%, garantia '+f.gar+' meses, caução '+f.cau+'/m',hash:h(now()+f.aud)});render()">
      <div class="f"><label>Auditoria amostral da vistoria prévia (%)</label><input name="aud" type="number" value="${PARAMS.auditPct}"><div class="hint">100% nos corredores de carga e na planície de inundação, sempre.</div></div>

      <div class="f"><label>Lei municipal de multa por dano à via</label><select name="lei"><option value="nao" ${!PARAMS.leiMulta?'selected':''}>Não identificada em Uruguaiana</option><option value="sim" ${PARAMS.leiMulta?'selected':''}>Vigente — escala em UFM</option></select><div class="hint">Enquanto não houver lei, o motor usa CTB art. 95 §3º (SESTRA) e execução da caução.</div></div>
      <div class="f"><label>Valor da UFM (R$)</label><input name="ufm" type="number" step="0.01" value="${PARAMS.ufm}"><div class="hint">Valor de exemplo — confirmar no decreto anual.</div></div>
      <div class="f"><label>Licenças suspensas</label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${['Corsan','RGE','CEEE Equatorial','Claro (fibra)'].map(i=>`<button type="button" class="btn sm ${PARAMS.susp[i]?'danger':''}" onclick="act_susp('${i}')">${i}: ${PARAMS.susp[i]?'suspensa':'normal'}</button>`).join('')}</div></div>
      <div class="formfoot"><button class="btn pri">Salvar parâmetros</button></div></form>`)}</div>`; }
    if(v==='audit'){ const l=[...AUDIT].reverse(); return `<div class="stack">${panel('Trilha de auditoria — registros desta sessão', l.length?`<div class="tabwrap"><table class="table"><tr><th>Quando</th><th>Quem</th><th>Intervenção</th><th>Evento</th><th>Hash</th></tr>${l.map(a=>`<tr><td class="mono small">${a.t}</td><td>${esc(a.w)}</td><td class="mono">${a.int}</td><td>${esc(a.e)}</td><td class="mono small">${a.hash}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum ato registrado ainda nesta sessão. Cada ação em qualquer perfil entra aqui com carimbo de tempo e hash.</div>')}</div>`; }
  }
  return '<div class="empty">Vista não disponível para este perfil.</div>';
}

/* ---------- Multa ---------- */
function mset(k,v){ S.tab.multa=Object.assign({fund:'ctb',base:488.10,dias:0,quadras:1},S.tab.multa||{},{[k]:v}); render(); }
function multaView(){
  const u=U(); const cands=INTS.filter(i=>['s9b','s13b','s14'].includes(i.st)); const it=S.sel&&INT(S.sel)&&cands.includes(INT(S.sel))?INT(S.sel):cands[0];
  const m=S.tab.multa||{fund:'ctb',base:488.10,dias:0,quadras:1};
  const all=INTS.filter(i=>i.multas.length);
  let calc='';
  if(it){
    if(m.fund==='ctb'){ const tot=(m.base+m.base*m.dias)*m.quadras; calc=`<div class="calc"><span>Valor base (CTB art. 95 §3º, graduado)</span><span class="r">${brl(m.base)}</span><span>Diária × ${m.dias} dia(s) de descumprimento</span><span class="r">${brl(m.base*m.dias)}</span><span>× ${m.quadras} quadra(s) licenciada(s) separadamente</span><span class="r">×${m.quadras}</span><span class="tot">Total do auto — competência SESTRA (órgão do SNT)</span><span class="tot r">${brl(tot)}</span></div>`; m.total=tot; m.baseTxt='CTB art. 95, §3º — via SESTRA'; }
    if(m.fund==='cau'){ const ref=it.ext*PARAMS.caucaoM*3.75, adm=ref*0.10, tot=ref+adm; calc=`<div class="calc"><span>Refazimento orçado — ${it.ext} m × faixa completa 3,00 m × SINAPI 102098</span><span class="r">${brl(ref)}</span><span>Taxa de administração 10%</span><span class="r">${brl(adm)}</span><span>Caução retida</span><span class="r">− ${brl(it.caucao)}</span><span class="tot">Saldo a cobrar do interveniente</span><span class="tot r">${brl(Math.max(0,tot-it.caucao))}</span></div>`; m.total=tot; m.baseTxt='Execução da recomposição pela prefeitura — caução + 10%'; }
    if(m.fund==='lei'){ calc=`<div class="calc"><span class="muted">Sem lei municipal de multa por dano à via identificada em Uruguaiana. A Gravitas fornece a minuta (escala em UFM: leve 500–2.000, média 2.000–10.000, grave 10.000–30.000, gravíssima 30.000–50.000, diária 10%) — a aprovação é decisão da administração.</span><span class="r">—</span></div>`; m.total=0; }
  }
  const can=(u.assina||[]).includes('AI')||(u.assina||[]).includes('AI-CTB');
  return `<div class="stack">${it?panel('Calcular e emitir auto de infração — '+it.id, `<div class="form">
    <div class="f full"><label>Intervenção</label><select onchange="S.sel=this.value;render()">${cands.map(c=>`<option value="${c.id}" ${c.id===it.id?'selected':''}>${c.id} — ${esc(SEG[c.seg].rua)} · ${esc(c.interv)} · ${ST[c.st].n}</option>`).join('')}</select></div>
    <div class="f full"><label>Fundamento</label><div class="radio">${[['ctb','CTB art. 95 §3º — obra sem licença / sinalização (SESTRA)'],['cau','Execução da caução + 10% (refazimento pela prefeitura)'],['lei','Lei municipal — dano à via (UFM)']].map(([k,l])=>`<label><input type="radio" name="fund" ${m.fund===k?'checked':''} onchange="mset('fund','${k}')"> ${l}</label>`).join('')}</div></div>
    ${m.fund==='ctb'?`<div class="f"><label>Gravidade → valor base</label><select onchange="mset('base',+this.value)">${[['81.35','Leve — R$ 81,35'],['195.23','Média — R$ 195,23'],['325.40','Grave — R$ 325,40'],['488.10','Gravíssima — R$ 488,10']].map(([v,l])=>`<option value="${v}" ${+v===m.base?'selected':''}>${l}</option>`).join('')}</select></div><div class="f"><label>Dias de descumprimento (diária)</label><input type="number" value="${m.dias}" min="0" onchange="mset('dias',+this.value)"></div><div class="f"><label>Quadras (autos separados)</label><input type="number" value="${m.quadras}" min="1" onchange="mset('quadras',+this.value)"></div><div class="f"><div class="hint" style="margin-top:22px">A multa municipal não paga a rua — pune iniciar sem licença. O refazimento sai da caução; a sanção pesada vai pela AGERGS (ofícios).</div></div>`:''}
    </div>${calc}<div class="formfoot" style="padding:12px 16px"><button class="btn pri" ${can&&m.total?'':'disabled'} onclick="act_multa('${it.id}',{base:'${m.baseTxt}',v:${m.fund==='ctb'?m.base:0},dias:${m.dias||0},diaria:${m.fund==='ctb'?m.base:0},total:${m.total||0}})">${can?'Assinar (ICP-Brasil) e emitir auto':'Somente o signatário (SESTRA / Obras) emite'}</button></div>`):'<div class="callout">Nenhuma intervenção passível de auto no momento.</div>'}
    ${panel('Autos emitidos', all.length?`<div class="tabwrap"><table class="table"><tr><th>Auto</th><th>Intervenção</th><th>Interveniente</th><th>Fundamento</th><th class="r">Total</th><th>Situação</th></tr>${all.flatMap(i=>i.multas.map(x=>`<tr onclick="sel('${i.id}')" style="cursor:pointer"><td class="mono">${x.id}</td><td>${esc(SEG[i.seg].rua)}</td><td>${esc(i.interv)}</td><td>${esc(x.base)}</td><td class="r"><b>${brl(x.total)}</b></td><td><span class="pill ${x.st==='emitida'?'crit':'good'}"><i></i>${x.st}</span></td></tr>`)).join('')}</table></div>`:'<div class="empty">Nenhum auto emitido.</div>')}</div>`;
}
/* ---------- Ofício ---------- */
function oficioView(){
  const u=U(); const cands=INTS.filter(i=>['s9b','s13b','s14'].includes(i.st)); const it=S.sel&&cands.includes(INT(S.sel))?INT(S.sel):cands[0]; const dest=S.tab.of||'AGERGS';
  const can=(u.assina||[]).includes('OF');
  if(!it) return '<div class="callout">Nenhuma intervenção em escalonamento.</div>';
  const s=SEG[it.seg]; const nots=it.docs.filter(d=>d[0]==='NOT').map(d=>d[1]).join('; ')||'—'; const laudo=it.log.filter(l=>/laudo|parecer|patologia|apontamento/i.test(l.e)).map(l=>l.t+' — '+l.e).join('\n')||'—';
  const txt = dest==='AGERGS'
   ? `À Agência Estadual de Regulação dos Serviços Públicos Delegados do RS — AGERGS\n\nAssunto: descumprimento, pela ${it.interv}, das obrigações de recomposição do pavimento — ${s.rua}, ${s.entre} (${s.id})\n\nA Prefeitura de ${CITY.nome} informa que a intervenção ${it.id} (${it.motivo}, ${it.ext} m) foi objeto de vistoria técnica com o seguinte resultado:\n${laudo}\n\nNotificação(ões) emitida(s): ${nots}. Prazo vencido sem regularização.\n\nO padrão executivo de recomposição integra o Plano Municipal de Saneamento Básico (Lei 11.445/2007, art. 19, §6º). Requer-se a apuração nos termos das Resoluções Normativas AGERGS 13/2014 e 37/2017, a exemplo do processo relativo a Venâncio Aires.\n\nAnexos: LAV, laudo de vistoria, fotos georreferenciadas, notificações, trilha de auditoria (hash).`
   : `Ao Ministério Público do RS — Promotoria de Justiça de ${CITY.nome}\n\nAssunto: dano ao patrimônio público viário — ${s.rua}, ${s.entre} (${s.id}) — interveniente ${it.interv}\n\nA Prefeitura comunica, para as providências cabíveis, que a intervenção ${it.id} apresentou:\n${laudo}\n\nNotificação(ões): ${nots}. Não houve regularização no prazo. Requer-se a instauração de procedimento para reparação do dano e obrigação de fazer.\n\nAnexos: laudo, parecer de patologia, notificações, autos de infração e trilha de auditoria.`;
  return `<div class="stack">${panel('Ofício — escalonamento aos órgãos reguladores', `<div class="form">
    <div class="f"><label>Intervenção</label><select onchange="S.sel=this.value;render()">${cands.map(c=>`<option value="${c.id}" ${c.id===it.id?'selected':''}>${c.id} — ${esc(SEG[c.seg].rua)} · ${esc(c.interv)}</option>`).join('')}</select></div>
    <div class="f"><label>Destinatário</label><div class="radio">${['AGERGS','MP-RS'].map(d=>`<label><input type="radio" ${dest===d?'checked':''} onchange="S.tab.of='${d}';render()"> ${d}</label>`).join('')}</div></div>
    <div class="f full"><label>Minuta gerada a partir do laudo, das notificações e da trilha</label><textarea style="min-height:300px;font-family:var(--mono);font-size:12px">${esc(txt)}</textarea></div>
    <div class="formfoot"><button class="btn" onclick="toast('Minuta salva como rascunho')">Salvar rascunho</button><button class="btn pri" ${can?'':'disabled'} onclick="act_of('${it.id}','${dest}')">${can?'Assinar (ICP-Brasil) e protocolar':'Somente o signatário da Obras assina'}</button></div></div>`)}
    <div class="callout">Ordem de escalonamento adotada: notificação → auto de infração → suspensão de novas licenças ao interveniente → ofício à AGERGS (PMSB) → MP. Nunca "embargo da obra": interfere na concessão estadual e cai em liminar.</div></div>`;
}

<script>
/* ===================== DRAWER (detalhe da intervenção) ===================== */
function drawer(it){
  if(!it) return '';
  const s=SEG[it.seg], p=P(), u=U(), idx=stepIdx(it.st);
  const steps=ORDER.map((k,i)=>`<i class="${it.st==='s14'?'bad':i<idx?'done':i===idx?(['s9b','s13b'].includes(it.st)?'bad':'cur'):''}" title="${ST[k].n}"></i>`).join('')+`<i class="${it.st==='s14'?'bad':''}" title="Suspensa / escalonada"></i>`;
  const area=(it.ext*it.larg).toFixed(1);
  return `<aside class="drawer">
    <div class="head"><div class="code">${it.id} · ${s.id}</div><h3>${esc(s.rua)}</h3><div class="sub">${esc(s.entre)} · ${esc(it.interv)} · ${esc(it.motivo)}</div><div style="margin-top:10px">${pill(it)} <span class="pill step">etapa ${it.st.replace('s','')}/14</span></div><div class="steps">${steps}</div></div>

    ${it.prev?`<section><h4>Vistoria prévia (declarada por ${esc(it.interv)})</h4><dl class="kv"><dt>Pavimento</dt><dd>${esc(it.prev.pav)}</dd><dt>Trincas</dt><dd>${esc(it.prev.trincas)}</dd><dt>Afundamentos</dt><dd>${esc(it.prev.afund)}</dd><dt>Observações</dt><dd>${esc(it.prev.obs)}</dd></dl></section>`:''}
    ${it.fotos?`<section><h4>Fotos georreferenciadas — ${it.fotos}</h4><div class="photos">${Array.from({length:Math.min(4,it.fotos)},(_,i)=>`<div class="ph">#${i+1} · ${['prévia','abertura','reaterro','pós'][i]}</div>`).join('')}</div></section>`:''}
    ${it.apont.length?`<section><h4>Apontamentos do laudo</h4>${it.apont.map(a=>`<div class="callout ${a.g==='gravíssima'||a.g==='grave'?'crit':'warn'}" style="margin-bottom:6px"><b>${a.g}</b> — ${esc(a.n)}</div>`).join('')}</section>`:''}
    ${it.ensaios.length?`<section><h4>Ensaios</h4>${it.ensaios.map(e=>`<div class="doc" style="flex-wrap:wrap"><span class="k">${e.id}</span>${esc(e.tipo)} · ${e.pts} pt<span class="s">${e.st}</span>${e.res?`<div style="width:100%;margin-top:4px">${e.res.map(c=>`<span class="pill ${c.ok?'good':'crit'}" style="margin:2px 2px 0 0"><i></i>${c.k}: ${c.v}</span>`).join('')}<div class="h mono faint small">hash ${e.hash}</div></div>`:''}</div>`).join('')}</section>`:''}
    ${it.multas.length?`<section><h4>Autos de infração</h4>${it.multas.map(m=>`<div class="doc"><span class="k">${m.id}</span>${esc(m.base)}<span class="s"><b>${brl(m.total)}</b> · ${m.st}</span></div>`).join('')}</section>`:''}
    ${it.docs.length?`<section><h4>Documentos</h4><div class="docs">${it.docs.map(d=>`<div class="doc"><span class="k">${d[0]}</span>${esc(d[1])}<span class="s">${d[2]}</span></div>`).join('')}</div></section>`:''}
    <section><h4>Histórico (imutável)</h4><ul class="tl">${[...it.log].reverse().map(l=>`<li class="${/notifica|apontamento|patologia|NÃO CONFORME|infração|sem licença/i.test(l.e)?'bad':/recebid|licenciad|TRD|conforme|sem patologia/i.test(l.e)?'ok':'acc'}"><div><div class="t">${l.t} · ${esc(l.w)}</div><div class="e">${esc(l.e)}</div><div class="h">${l.hash}</div></div></li>`).join('')}</ul></section>
  </aside>`;
}
function actions(it){
  const p=P(), u=U(), s=SEG[it.seg];
  const box=(title,inner)=>`<section style="background:var(--surface-2)"><h4>${title}</h4>${inner}</section>`;
  if(p==='terc'&&it.interv!==u.interv) return '';
  if(p==='terc'){
    if(it.st==='s1') return box('Registrar vistoria prévia', `<form onsubmit="event.preventDefault();act_prev('${it.id}',F(this))" class="form" style="padding:0;grid-template-columns:1fr 1fr">
      <div class="f"><label>Estado do pavimento</label><select name="pav"><option>Bom</option><option>Regular</option><option>Ruim</option></select></div><div class="f"><label>Fotos georreferenciadas</label><input name="fotos" type="number" value="8" min="4"><div class="hint">mín. 4: duas por lado</div></div>
      <div class="f"><label>Trincas</label><select name="trincas"><option>Ausentes</option><option>Isoladas</option><option>Couro de jacaré</option></select></div><div class="f"><label>Afundamentos</label><select name="afund"><option>Ausentes</option><option>Localizados</option><option>Generalizados</option></select></div>
      <div class="f full"><label>Observações (patologias pré-existentes ficam registradas a seu favor)</label><textarea name="obs">Sarjeta íntegra; sem patologia pré-existente no trecho.</textarea></div>
      <div class="formfoot"><button class="btn pri">Registrar prévia</button></div></form>`);
    if(it.st==='s5') return box('Licença emitida', `<div class="btnrow"><button class="btn pri" onclick="act_start('${it.id}')">Informar início da execução</button><button class="btn" onclick="toast('LAV, LFT e PEX baixados em PDF assinado')">Baixar LAV · LFT · PEX</button></div>`);
    if(it.st==='s6') return box('Informar conclusão', `<form onsubmit="event.preventDefault();act_done('${it.id}',F(this))" class="form" style="padding:0"><div class="f"><label>Pontos do controle tecnológico</label><input name="pts" type="number" value="${Math.max(1,Math.round(it.ext/40))}"></div><div class="f"><label>Espessura média (cm)</label><input name="esp" type="number" step="0.1" value="5.0"></div><div class="f full"><div class="hint">Anexe o controle tecnológico do executor (obrigação do Caderno de Encargos). A Gravitas faz a análise crítica; contraprova só onde houver divergência.</div></div><div class="formfoot"><button class="btn pri">Informar conclusão</button></div></form>`);
    if(it.st==='s9b'||it.st==='s13b') return box('Responder à notificação', `<form onsubmit="event.preventDefault();act_fix('${it.id}',F(this).txt)" class="form" style="padding:0"><div class="f full"><label>Refazimento executado</label><textarea name="txt">Trecho reaberto, reaterro recompactado em camadas (GC 98%), recomposição na faixa completa conforme PEX. Fotos anexadas.</textarea></div><div class="formfoot"><button class="btn" onclick="event.preventDefault();toast('Contestação protocolada — prazo suspenso até resposta da Obras')">Contestar</button><button class="btn pri">Informar refazimento</button></div></form>`);
    if(it.st==='s14') return box('Regularização', `<div class="callout crit">Intervenção aberta sem licença. Solicite LAV/LFT de regularização; o auto de infração permanece.</div><div class="btnrow" style="margin-top:8px"><button class="btn pri" onclick="go('nova')">Solicitar regularização</button></div>`);
  }
  if(p==='grav'){
    if(it.st==='s2') return box('Auditoria da vistoria prévia', `<div class="callout" style="margin-bottom:8px">${s.rua.includes('Duque')||s.rua.includes('XV')?'Corredor prioritário — auditoria obrigatória (100%).':'Sorteada na amostra de '+PARAMS.auditPct+'%.'}</div><form onsubmit="event.preventDefault();const f=F(this);act_audit('${it.id}',f.res==='ok',f.obs)" class="form" style="padding:0"><div class="f full"><div class="radio"><label><input type="radio" name="res" value="ok" checked> Concorda com a declaração</label><label><input type="radio" name="res" value="div"> Diverge</label></div></div><div class="f full"><label>Observação</label><textarea name="obs">Patologia pré-existente delimitada em foto; sarjeta íntegra.</textarea></div><div class="formfoot"><button class="btn green">Assinar auditoria</button></div></form>`);
    if(it.st==='s7'||(it.st==='s8'&&it.ensaios.some(e=>e.st==='lançado'))) return box('Vistoria de recebimento', `<form onsubmit="event.preventDefault();const f=F(this);act_recv('${it.id}',f.res==='ok',[{n:f.a1,g:f.g1}].filter(a=>a.n))" class="form" style="padding:0">
      ${it.ensaios.some(e=>e.st==='lançado')?`<div class="f full"><div class="callout ${it.ensaios.every(e=>e.ok)?'good':'crit'}">Contraprova ${it.ensaios.every(e=>e.ok)?'conforme':'NÃO conforme'} — ${it.ensaios.filter(e=>e.res).map(e=>e.res.map(c=>c.k+' '+c.v).join(', ')).join('; ')}</div></div>`:''}
      <div class="f full"><div class="radio"><label><input type="radio" name="res" value="ok" ${it.ensaios.some(e=>e.st==='lançado'&&!e.ok)?'':'checked'}> Sem apontamento — emitir TRP</label><label><input type="radio" name="res" value="nok" ${it.ensaios.some(e=>e.st==='lançado'&&!e.ok)?'checked':''}> Com apontamentos</label></div></div>
      <div class="f"><label>Apontamento</label><input name="a1" value="${it.ensaios.some(e=>e.st==='lançado'&&!e.ok)?'Espessura de CBUQ abaixo do projeto — contraprova não conforme':'Afundamento de 2,5 cm na régua de 3 m'}"></div><div class="f"><label>Gravidade</label><select name="g1"><option>leve</option><option>média</option><option selected>grave</option><option>gravíssima</option></select></div>
      <div class="formfoot">${it.st==='s7'?`<button type="button" class="btn" onclick="act_ensaio('${it.id}','Extração de testemunho — espessura, GC, ligante',2)">Pedir contraprova</button>`:''}<button class="btn green">Assinar laudo</button></div></form>`);
    if(it.st==='s8') return box('Recebimento em curso', `<div class="callout warn">Aguardando resultado de ${it.ensaios.filter(e=>e.st==='pendente').map(e=>e.id).join(', ')} pelo laboratório.</div>`);
    if(['s10','s11','s12'].includes(it.st)) return box('Vistoria de garantia — '+ST[it.st].n.split('— ')[1], `<form onsubmit="event.preventDefault();const f=F(this);act_gar('${it.id}',f.res==='ok',f.obs)" class="form" style="padding:0"><div class="f full"><div class="radio"><label><input type="radio" name="res" value="ok" checked> Sem patologia</label><label><input type="radio" name="res" value="nok"> Patologia</label></div></div><div class="f full"><label>Descrição</label><input name="obs" value="Afundamento longitudinal 3 cm sobre a vala — recalque do reaterro"></div><div class="formfoot"><button class="btn green">Assinar vistoria</button></div></form>`);
    if(it.st==='s13b') return box('Parecer de patologia', `<form onsubmit="event.preventDefault();const f=F(this);act_parecer('${it.id}',f.causa,f.txt)" class="form" style="padding:0"><div class="f full"><label>Causa provável</label><select name="causa"><option>recalque do reaterro (GC insuficiente)</option><option>espessura de CBUQ abaixo do projeto</option><option>ausência de base granular</option><option>rejunte/colchão de areia inadequado</option><option>drenagem — infiltração na vala</option></select></div><div class="f full"><label>Fundamentação</label><textarea name="txt">Afundamento restrito à projeção da vala, sem trincas no entorno: exclui causa estrutural do pavimento existente. Compatível com reaterro não compactado em camadas. Refazimento devido em garantia.</textarea></div><div class="formfoot"><button class="btn green">Assinar parecer (ART)</button></div></form>`);
  }
  if(p==='lab'){ const e=it.ensaios.find(x=>x.st==='pendente'); if(e) return box('Lançar resultado — '+e.id, `<form onsubmit="event.preventDefault();act_lab('${it.id}','${e.id}',F(this))" class="form" style="padding:0">
      <div class="f"><label>Espessura medida (cm)</label><input name="esp" type="number" step="0.1" value="4.5"></div><div class="f"><label>Espessura de projeto (cm)</label><input name="proj" type="number" step="0.1" value="5.0"></div>
      <div class="f"><label>Grau de compactação (%)</label><input name="gc" type="number" step="0.1" value="96.2"></div><div class="f"><label>Teor de ligante (%)</label><input name="lig" type="number" step="0.01" value="5.10"></div>
      <div class="f"><label>Ligante de projeto (%)</label><input name="ligp" type="number" step="0.01" value="5.50"></div><div class="f"><div class="hint" style="margin-top:22px">Tolerâncias DNIT 112/2009: espessura ±5%, GC 97–101%, ligante ±0,3%. O sistema classifica; você assina.</div></div>
      <div class="formfoot"><button class="btn pri">Assinar e lançar (imutável)</button></div></form>`); }
  if(p==='pref'){
    if(it.st==='s4'){ const mine=(u.assina||[]).filter(d=>['LAV','LFT'].includes(d)&&!it.sig[d]); return box('Análise e assinatura', `<dl class="kv" style="margin-bottom:10px"><dt>LAV (Obras)</dt><dd>${it.sig.LAV?'✓ '+esc(it.sig.LAV.w)+' · '+it.sig.LAV.t:'pendente'}</dd><dt>LFT (SESTRA)</dt><dd>${it.sig.LFT?'✓ '+esc(it.sig.LFT.w)+' · '+it.sig.LFT.t:'pendente'}</dd><dt>Caução ao licenciar</dt><dd class="mono">${brl(caucaoDe(it))}</dd></dl><div class="btnrow">${mine.map(d=>`<button class="btn pri" onclick="act_sign('${it.id}','${d}')">Assinar ${d} (${u.cert})</button>`).join('')||`<span class="small muted">${u.papel==='Signatário'?'Sua assinatura já consta.':'Operador: prepare o processo; a assinatura é do signatário.'}</span>`}<button class="btn" onclick="toast('Exigência enviada ao interveniente — prazo 5 dias úteis')">Exigência</button></div>`); }
    if(it.st==='s3') return box('Prévia auditada', `<button class="btn pri" onclick="act_analise('${it.id}')">Enviar para análise (Obras + SESTRA)</button>`);
    if(it.st==='s9b'&&!it.docs.some(d=>d[0]==='NOT')) return box('Laudo com apontamentos', `<button class="btn pri" onclick="go('not','${it.id}')">Emitir notificação</button>`);
    if(['s9b','s13b','s14'].includes(it.st)) return box('Escalonamento', `<div class="btnrow"><button class="btn" onclick="go('multa','${it.id}')">Calcular multa</button><button class="btn" onclick="go('of','${it.id}')">Ofício AGERGS / MP</button><button class="btn danger" onclick="act_susp('${it.interv}')">${PARAMS.susp[it.interv]?'Restabelecer':'Suspender'} novas licenças — ${esc(it.interv)}</button></div>`);
    if(it.st==='s8') return box('Análise crítica', `<div class="callout warn">Contraprova ${it.ensaios.map(e=>e.id+' ('+e.st+')').join(', ')} — resultado entra direto do laboratório.</div>`);
  }
  return '';
}

/* ===================== MAPA ===================== */
function mapBlock(clickable){
  const segs=SEGS.map(sg=>{ const it=cur(sg.id); const pr=PROG.find(x=>x.seg===sg.id); const st=it?popOf(it):(pr?POP.prog:null);
    const col=st?st.col:'var(--line)'; const dash=st&&st.dash?`stroke-dasharray="${st.dash}"`:''; const on=(it&&S.sel===it.id)||(S.segSel===sg.id);
    const ttl=`${sg.rua} — ${sg.entre}${it?' · '+ST[it.st].n+' · '+it.interv:pr?' · programada '+pr.mes+' · '+pr.interv:' · sem intervenção'}`;
    const click = clickable?`onclick="${it?`sel('${it.id}')`:`pickSeg('${sg.id}')`}"`:'';
    const mid=[(sg.x1+sg.x2)/2,(sg.y1+sg.y2)/2];
    return `<g ${click}><title>${esc(ttl)}</title><line class="seg hit" x1="${sg.x1}" y1="${sg.y1}" x2="${sg.x2}" y2="${sg.y2}"/><line class="seg ${on?'on':''}" x1="${sg.x1}" y1="${sg.y1}" x2="${sg.x2}" y2="${sg.y2}" style="stroke:${col}" ${dash}/>${st?`<rect x="${mid[0]-7}" y="${mid[1]-7}" width="14" height="14" fill="${col}"/><text x="${mid[0]}" y="${mid[1]+3.5}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="600" fill="#fff">${st.g}</text>`:''}${on?`<circle class="ring" cx="${mid[0]}" cy="${mid[1]}" r="13"/>`:''}</g>`; }).join('');
  const labels = EW.map((r,j)=>`<text class="lbl" x="${VX[0]-12}" y="${HY[j]+3}" text-anchor="end">${esc(r)}</text>`).join('') + NS.map((r,i)=>`<text class="lbl" transform="rotate(-90 ${VX[i]+3} ${HY[0]-14})" x="${VX[i]+3}" y="${HY[0]-14}" text-anchor="start">${esc(r)}</text>`).join('');
  const legend=`<div class="legend">${Object.values(POP).map(p=>`<span><i style="background:${p.col}"></i><span class="glyph" style="background:${p.col}">${p.g}</span>${p.n}</span>`).join('')}<span><i style="background:var(--ink);opacity:.35"></i>corredor de carga</span></div>`;
  return `<div class="map"><svg viewBox="0 -70 800 550" role="img" aria-label="Mapa esquemático das intervenções — Centro de Uruguaiana"><line class="corr" x1="20" y1="455" x2="780" y2="455"/><text class="lbl" x="22" y="447">BR-472 · acesso ao Porto Seco (corredor de carga — auditoria 100%)</text><text class="lbl" x="778" y="-52" text-anchor="end">Centro · malha esquemática · N ↑</text>${labels}${segs}</svg>${legend}</div>`;
}
function pickSeg(id){ S.segSel=(S.segSel===id?null:id); S.sel=null; render(); }

/* ===================== ÁREA PÚBLICA ===================== */
function publicPage(){
  const q=(S.q||'').toLowerCase();
  const ruas=[...EW,...NS];
  const rua = S.rua || (q? ruas.find(r=>r.toLowerCase().includes(q)) : null);
  const kp = kpis([['Ruas abertas hoje',INTS.filter(i=>i.st==='s6').length,'crit'],['Aguardando repavimentação',INTS.filter(i=>['s7','s8'].includes(i.st)).length,'warn'],['Em correção pelo responsável',INTS.filter(i=>['s9b','s13b','s14'].includes(i.st)).length,'serious'],['Concluídas e aprovadas em 2026',INTS.filter(i=>ST[i.st].pop==='ok').length,'good'],['Programadas para os próximos meses',PROG.length,'']]);
  let side='';
  const it = S.sel && INT(S.sel);
  if(it){ const s=SEG[it.seg], p=popOf(it);
    side=`<div class="panel"><header><h3>${esc(s.rua)} <span class="muted">· ${esc(s.entre)}</span></h3><button class="btn sm" onclick="S.sel=null;render()">Fechar</button></header>
      <div style="padding:14px 16px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><span class="glyph" style="background:${p.col}">${p.g}</span><b>${p.n}</b></div>
      <dl class="kv"><dt>Responsável</dt><dd>${esc(it.interv)}</dd><dt>O que está sendo feito</dt><dd>${esc(it.motivo)}</dd><dt>Extensão</dt><dd class="mono">${it.ext} m</dd><dt>Licença</dt><dd>${it.docs.find(d=>d[0]==='LAV')?esc(it.docs.find(d=>d[0]==='LAV')[1]):(it.st==='s14'?'<span class="pill crit"><i></i>sem licença</span>':'em análise')}</dd><dt>Garantia</dt><dd>${it.st==='s13a'?'encerrada — aprovada':(['s10','s11','s12','s13b'].includes(it.st)?'em garantia até '+addM(it.dt,14):'—')}</dd></dl>
      ${it.st==='s6'?'<div class="callout crit" style="margin-top:10px">Rua com interdição — desvio sinalizado conforme a licença de trânsito.</div>':''}
      ${['s9b','s13b','s14'].includes(it.st)?'<div class="callout" style="margin-top:10px">A prefeitura constatou problema na recomposição e exigiu o refazimento pelo responsável, sem custo para o município.</div>':''}
      ${ST[it.st].pop==='ok'?`<div style="margin-top:12px"><div class="eyebrow" style="margin-bottom:6px">Antes / depois — arraste</div><div class="ba" id="ba"><div class="a"></div><div class="b"></div><span class="cap" style="left:6px">ANTES</span><span class="cap" style="right:6px">DEPOIS</span><input type="range" min="0" max="100" value="50" oninput="document.getElementById('ba').style.setProperty('--cut',this.value+'%')" aria-label="Comparar antes e depois"></div></div>`:''}
      <h4 class="eyebrow" style="margin:14px 0 6px">Histórico desta intervenção</h4><ul class="tl">${[...it.log].reverse().filter(l=>!/hash|análise crítica/i.test(l.e)).map(l=>`<li class="${/notifica|apontamento|patologia|infração|sem licença/i.test(l.e)?'bad':/recebid|licenciad|TRD|sem patologia/i.test(l.e)?'ok':'acc'}"><div><div class="t">${l.t.slice(0,10)}</div><div class="e">${esc(l.e.replace(/\s*\(ICP-Brasil.*?\)/,'').replace(/;?\s*hash.*$/,''))}</div></div></li>`).join('')}</ul>
      <div class="btnrow" style="margin-top:12px"><button class="btn sm" onclick="toast('Você receberá aviso quando esta rua mudar de situação')">Seguir esta rua</button><button class="btn sm" onclick="toast('Relato registrado com foto e localização — vai direto à fiscalização')">Relatar problema</button></div></div></div>`;
  } else if(rua){
    const segs=SEGS.filter(s=>s.rua===rua);
    side=`<div class="panel"><header><h3>${esc(rua)}</h3><button class="btn sm" onclick="S.rua=null;S.q='';render()">Limpar</button></header><div style="padding:14px 16px" class="rua">
      <div class="eyebrow" style="margin-bottom:4px">Cronograma — o que está acontecendo e o que vem</div>
      ${segs.map(s=>{ const it=cur(s.id), pr=PROG.find(x=>x.seg===s.id); const p=it?popOf(it):(pr?POP.prog:null);
        return `<div class="it" ${it?`onclick="sel('${it.id}')" style="cursor:pointer"`:''}><span class="glyph" style="background:${p?p.col:'var(--line)'}">${p?p.g:'·'}</span><div><b>${esc(s.entre)}</b><div class="d">${it?ST[it.st].n+' · '+it.interv+' · '+it.motivo:pr?'Programada para '+pr.mes+' · '+pr.interv+' · '+pr.motivo:'Sem intervenção prevista'}</div></div><span class="q">${s.id.split('-').slice(2).join('-')}</span></div>`; }).join('')}
      <div class="callout" style="margin-top:8px">A programação futura vem da declaração mensal de cada concessionária. Se sua rua aparece como <b>Programada</b>, ela será aberta no mês indicado — a prefeitura não repavimenta antes disso.</div></div></div>`;
  } else {
    side=`<div class="panel"><header><h3>Encontre a sua rua</h3></header><div style="padding:14px 16px"><div class="search" style="min-width:0"><span class="faint">⌕</span><input placeholder="Digite o nome da rua" value="${esc(S.q)}" oninput="S.q=this.value;S.rua=null;render();document.querySelector('.pub .search input').focus()"></div>
      <div class="rua" style="margin-top:12px">${ruas.map(r=>{ const n=SEGS.filter(s=>s.rua===r).filter(s=>cur(s.id)||PROG.find(x=>x.seg===s.id)).length; return `<div class="it" onclick="S.rua='${esc(r)}';render()" style="cursor:pointer"><span class="glyph" style="background:${n?'var(--ink)':'var(--line)'}">${n}</span><div><b>${esc(r)}</b><div class="d">${n?n+' quadra(s) com intervenção ou programação':'sem intervenções'}</div></div><span class="q">ver</span></div>`; }).join('')}</div></div></div>`;
  }
  return `<div class="pubhead"><div class="pb">${MARK}<div><h1>Obras nas ruas de <em>${CITY.nome}</em></h1><div class="sub">Quem abriu, com que licença, quando fecha e se a prefeitura aprovou — atualizado a cada registro · Prefeitura Municipal de ${CITY.nome} com Gravitas</div></div></div><div class="sp"></div><button class="btn" onclick="S.uid='obr1';S.view='inbox';S.sel=null;render()">Acesso restrito</button></div>
    <div class="content">${kp}<div class="stack">${mapBlock(true)}<div class="callout">Não aparecem aqui: valores de caução e multa, dados pessoais dos responsáveis, laudos em recurso. O que aparece: o estado de cada quadra, a licença e o histórico datado. Dados de demonstração.</div></div>${side}</div>`;
}

render();
</script>
